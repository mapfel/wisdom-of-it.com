name: update-slides
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate Slides
        run: ./build.sh GenerateSlides
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: output
          retention-days: 1

  # publishes only what was pushed to develop, which includes completed pull requests
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifacts
          path: wisdom-of-it

      - name: 'Tar files'
        run: tar -cvf wisdom-of-it.tar ./wisdom-of-it

      - name: Copy file via SSH
        uses: appleboy/scp-action@master
        with:
          host: 185.183.159.67
          username: ${{ secrets.USER_NAME }}
          password: ${{ secrets.USER_PASSWORD }}
          source: "wisdom-of-it.tar"
          target: "/var/www/html"

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: 185.183.159.67
          username: ${{ secrets.USER_NAME }}
          password: ${{ secrets.USER_PASSWORD }}
          script: |
            rm -drf /var/www/html/wisdom-of-it
            tar -xvf /var/www/html/wisdom-of-it.tar -C /var/www/html/
            chown -R www-data:www-data /var/www/html/wisdom-of-it
            chmod -R 775 /var/www/html/wisdom-of-it

